name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by deploy-pages: id-token proves the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a half-published shell would be served offline.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Format, lint and type errors fail the build rather than reaching the phone.
      - run: bun run check

      # The barcode encoders are hand-written; a regression here means a card that
      # will not scan at the till, which is not something to discover in a shop.
      - run: bun run test

      - run: bun run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
